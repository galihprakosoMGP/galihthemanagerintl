<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>THE MANAGER</title>
  <meta name="theme-color" content="#06101F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">
<div id="auth" class="auth" hidden></div>

<div class="shell">
  <aside class="side">
    <a class="brand" href="#/" aria-label="THE MANAGER">
      <span class="logo" id="logo" aria-hidden="true"></span>
      <span><b>THE MANAGER</b><small id="tagline"></small></span>
    </a>
    <nav id="nav"></nav>
    <div class="tools">
      <select id="lang"></select>
      <button id="langbtn" class="ibtn langbtn" type="button" data-act="langmenu"></button>
      <button id="bell" class="ibtn" type="button" data-act="notifs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span id="badge" class="badge" hidden></span>
      </button>
      <button id="cog" class="ibtn" type="button" data-act="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>

<div id="modal" class="modal" hidden></div>
<div id="report" class="report-wrap" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- Script order matters: i18n -> flags -> db -> auth -> data -> calc -> charts -> notify -> views -> app -->
<script src="js/i18n.js"></script>
<script src="js/flags.js"></script>
<script src="js/config.js"></script>
<script src="js/install.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/autobackup.js"></script>
<script src="js/calc.js"></script>
<script src="js/charts.js"></script>
<script src="js/notify.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
